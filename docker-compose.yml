version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: hanoi_air_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    networks:
      - hanoi_air

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanoi_air_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - hanoi_air

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanoi_air_worker
    command: celery -A worker.tasks worker -B --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hanoi_air

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanoi_air_dashboard
    command: streamlit run /app/app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    depends_on:
      - api
      - redis
    networks:
      - hanoi_air

volumes:
  redis_data:

networks:
  hanoi_air:
    driver: bridge
