[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanoi-air-forecast"
version = "0.2.0"
description = "Hybrid live/demo Hanoi 24h air pollution forecast and downwind alert system"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "streamlit>=1.34",
  "streamlit-folium>=0.20",
  "folium>=0.16",
  "plotly>=5.20",
  "celery>=5.3",
  "redis>=5.0",
  "torch>=2.2",
  "metpy>=1.6",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "pytest>=8.0",
  "httpx>=0.27",
  "loguru>=0.7",
  "tenacity>=8.2",
  "filelock>=3.13",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "sentry-sdk[fastapi,celery]>=2.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest-cov>=5.0",
  "types-requests"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", ".venv", "data"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "C4",   # flake8-comprehensions
]
ignore = [
  "E501",  # line too long (handled by black)
  "B008",  # do not perform function calls in argument defaults (FastAPI uses this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow assert False
"app/streamlit_app.py" = ["E402"]  # sys.path manipulation before imports
"api/main.py" = ["E402"]
"worker/tasks.py" = ["E402"]
"scripts/*" = ["E402"]  # entry-point scripts insert src/ into sys.path first

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
  | \.venv
  | notebooks
  | data
)/
'''

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/hanoi_air"]
exclude = ["tests/", "notebooks/", "scripts/"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["folium.*", "streamlit_folium.*", "pykrige.*", "metpy.*"]
ignore_missing_imports = true
