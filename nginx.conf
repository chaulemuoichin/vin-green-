# Reverse proxy for the Hanoi Air Forecast prod stack.
#   /api/*   →  fastapi  (port 8000)
#   /docs    →  fastapi  (so /docs and /redoc work behind the proxy)
#   /openapi.json → fastapi
#   /health  →  nginx-local liveness (does not hit upstream)
#   /        →  streamlit dashboard (port 8501), with WebSocket upgrade

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

upstream dashboard_upstream {
    server dashboard:8501;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Keep request bodies modest — this API is read-only.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 90s;

    # nginx-local liveness for orchestrator probes.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # FastAPI is reachable at /api/*. Strip the prefix when forwarding.
    location /api/ {
        proxy_pass http://api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI swagger / OpenAPI live at their canonical paths under /docs.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Streamlit dashboard is the default. WebSocket upgrade is required for
    # the hot-reload / interactive components.
    location / {
        proxy_pass http://dashboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
