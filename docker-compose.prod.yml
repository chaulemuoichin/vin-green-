# Production overlay: pinned image tags, restart policies, healthchecks on
# every service, optional nginx reverse proxy on :80 that routes /api/* to
# the FastAPI service and everything else to the Streamlit dashboard.
#
# Usage:
#   make prod-up                    (or: docker-compose -f docker-compose.prod.yml up -d)
#   curl http://localhost/api/health
#
# This file fully redeclares services (it is not an overlay-merge — the
# project uses standalone compose files so production never accidentally
# inherits dev defaults).

version: '3.9'

services:
  redis:
    image: redis:7.4-alpine
    container_name: hanoi_air_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1000
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - hanoi_air_prod

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hanoi_air:0.3.0
    container_name: hanoi_air_api_prod
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - HANOI_AIR_LOG_LEVEL=INFO
      - HANOI_AIR_LOG_JSON=true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - cache_data_prod:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - hanoi_air_prod

  worker:
    image: hanoi_air:0.3.0
    container_name: hanoi_air_worker_prod
    restart: unless-stopped
    command: celery -A worker.tasks worker -B --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - HANOI_AIR_LOG_LEVEL=INFO
      - HANOI_AIR_LOG_JSON=true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - cache_data_prod:/app/.cache
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      # Celery is not HTTP — use the broker ping as a liveness signal.
      test: ["CMD", "celery", "-A", "worker.tasks", "inspect", "ping", "--timeout=5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hanoi_air_prod

  dashboard:
    image: hanoi_air:0.3.0
    container_name: hanoi_air_dashboard_prod
    restart: unless-stopped
    command: >
      streamlit run /app/app/streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --server.fileWatcherType=none
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - cache_data_prod:/app/.cache
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hanoi_air_prod

  nginx:
    image: nginx:1.27-alpine
    container_name: hanoi_air_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - hanoi_air_prod

volumes:
  redis_data_prod:
  cache_data_prod:

networks:
  hanoi_air_prod:
    driver: bridge
